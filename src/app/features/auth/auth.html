<section class="auth">
  <div class="auth__visual"></div>
  <div class="auth__content">
    <div class="auth__panel">
      <div class="auth__header">
        <h1>{{ title() }}</h1>
        <i> {{ description() }}</i>
      </div>
      <div class="auth__form">
        <form>
          @if (isLogin()) {
            <app-form-input
              placeholder="Email"
              label="Email"
              type="email"
              [field]="loginForm.email"
            />
            <app-form-input
              placeholder="Password"
              label="Password"
              type="password"
              [field]="loginForm.password"
            />
          } @else {
            <app-form-input placeholder="Name" label="Name" />
            <app-form-input placeholder="Last name" label="Last name" />
            <app-form-input placeholder="Email" label="Email" type="email" />
            <app-form-input placeholder="Password" label="Password" type="password" />
            <app-form-input
              placeholder="Confirm password"
              label="Confirm password"
              type="password"
            />
          }
        </form>
      </div>
      <div class="auth__action">
        <app-button
          [disabled]="loginForm().invalid()"
          (clicked)="execute()"
          [name]="buttonName()"
          type="primary"
        />
        <app-button [disabled]="false" [name]="linkName()" (clicked)="redirect()" type="link" />
      </div>
    </div>
  </div>
</section>
