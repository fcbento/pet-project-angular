<header class="list-header">
  <div class="title-group">
    <h1>Vendas</h1>
    <span class="subtitle">Controle de vendas realizadas</span>
  </div>
  <div class="actions">
    <app-button name="Excluir Todas" type="danger" [disabled]="false" (clicked)="deleteAll()"
      style="margin-right: 1rem;"></app-button>
    <app-button name="Nova Venda" type="primary" [disabled]="false" (clicked)="newSale()"></app-button>
  </div>
</header>

<section class="filters">
  <div class="period-filters">
    <button class="filter-btn" [class.active]="selectedPeriod() === 'Ano Completo'" (click)="setFullYear()">
      Ano Completo
    </button>
    <div class="divider"></div>
    @for (month of months; track month; let i = $index) {
    <button class="filter-btn" [class.active]="selectedPeriod() === month" (click)="setMonth(i)">
      {{ month }}
    </button>
    }
  </div>

  <div class="filters-row">
    <app-form-select label="Origem" placeholder="Todas as origens" [options]="origemOptions()"
      [(value)]="origemFilter" />
    
    <div class="date-info">
      <span class="label">PerÃ­odo Selecionado:</span>
      <span class="value">{{ startDateFilter() | date:'dd/MM/yyyy' }} - {{ endDateFilter() | date:'dd/MM/yyyy' }}</span>
    </div>

    <div class="filter-actions">
      <app-button name="Limpar Filtros" type="secondary" [disabled]="false" (clicked)="clearFilters()"></app-button>
    </div>
  </div>
</section>

<section class="summary-cards">
  <app-summary-card label="Total de Vendas" [value]="summary().totalSell" icon="ğŸ›ï¸" />
  <app-summary-card label="Receita Total" [value]="summary().totalPrice" type="currency" icon="ğŸ’°" />
  <app-summary-card label="Lucro Total" [value]="summary().totalProfit" type="currency" variant="success" icon="ğŸ“ˆ" />
  <app-summary-card label="Margem de Lucro" [value]="summary().profitMargin" type="percentage" variant="warning"
    icon="ğŸ“Š" />
</section>

@if (sales().length > 0) {
<app-table [columns]="columns" [data]="sales()" [actions]="rowActions" [withPagination]="true"
  title="HistÃ³rico de Vendas" subtitle="Listagem detalhada de todas as vendas realizadas"
  (selectionChange)="onRowsSelected($event)" />
} @else {
<div class="empty-state-card">
  <span class="icon">ğŸ”</span>
  <p>Nenhuma venda realizada ainda. Vamos vender! ğŸš€</p>
</div>
}
<app-confirm-dialog [(isOpen)]="isDeleteDialogOpen" title="Excluir Venda"
  [message]="'Deseja excluir a venda de ID ' + (saleToDelete()?.id || '') + '?'" confirmText="Sim, Excluir"
  cancelText="Cancelar" type="danger" (confirm)="confirmDelete()"></app-confirm-dialog>
<app-confirm-dialog [(isOpen)]="isDeleteAllDialogOpen" title="Excluir Todas as Vendas" message="ATENÇÃO: Esta ação é irreversível e excluirá todo o histórico de vendas. Deseja continuar?" confirmText="Sim, Excluir Tudo" cancelText="Cancelar" type="danger" (confirm)="confirmDeleteAll()"></app-confirm-dialog>
