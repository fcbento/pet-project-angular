<section class="auth">
  <div class="auth__visual"></div>
  <div class="auth__content">
    <div class="auth__panel">
      <div class="auth__header">
        <img src="logo.png" alt="" width="200px" />
      </div>
      <div class="auth__form">
        <form>
          @for (form of formulary(); track form) {
            <app-form-input
              [placeholder]="form.placeholder"
              [label]="form.label"
              [type]="form.type!"
              [field]="form.field"
            />
          }
        </form>
      </div>
      <div class="auth__action">
        <app-button
          [disabled]="disable()"
          (clicked)="execute()"
          [name]="buttonName()"
          [loading]="loading()"
          type="primary"
        />
        <app-button [disabled]="false" [name]="linkName()" (clicked)="redirect()" type="link" />
      </div>
    </div>
  </div>
</section>
