<section class="category">
  <header class="category__header">
    <div class="title-group">
      <h1>Categorias</h1>
      <span class="subtitle">Controle de categorias dos produtos</span>
    </div>
    <app-button [disabled]="false" (clicked)="openForm()" name="Nova Categoria" type="primary" />
  </header>
  <app-modal title="Nova Categoria" [(isOpen)]="formOpen">
    <app-register (success)="onSuccess()" />
  </app-modal>
  <app-list [updateTable]="updateTable()" />
</section>
