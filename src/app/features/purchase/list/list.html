<section class="purchase-container">
  <header class="purchase__header">
    <div class="purchase__title">
      <h1>Registro de Compras</h1>
      <span class="subtitle">Controle manual de entradas e fornecedores</span>
    </div>

    <div class="purchase__actions">
      <div class="filters">
        <app-form-input label="Início" type="date" [value]="startDate()" (valueChange)="setString(startDate, $event)"></app-form-input>
        <app-form-input label="Fim" type="date" [value]="endDate()" (valueChange)="setString(endDate, $event)"></app-form-input>
        <app-button name="Atualizar" type="secondary" (clicked)="reload()" [disabled]="false"></app-button>
      </div>
      <div class="main-action">
        <app-button name="Adicionar Compra" type="primary" (clicked)="openAdd()" [disabled]="false"></app-button>
      </div>
    </div>
  </header>

  <main class="purchase__content">
    <app-table 
      [columns]="columns" 
      [data]="purchases()" 
      [actions]="actions">
    </app-table>
  </main>

  <app-modal [title]="isEditing() ? 'Editar Compra' : 'Nova Compra'" [(isOpen)]="isModalOpen">
    <div class="purchase-form">
      <div class="form-row">
        <app-form-input label="Data e Hora" type="datetime-local" [value]="formDate()" (valueChange)="setString(formDate, $event)"></app-form-input>
        <app-form-select label="Tipo de Compra" [options]="typeOptions" [value]="formType()" (valueChange)="setString(formType, $event)"></app-form-select>
      </div>

      <app-form-input label="Fornecedor" type="text" [value]="formSupplier()" (valueChange)="setString(formSupplier, $event)" placeholder="Ex: Atacadão"></app-form-input>
      <app-form-input label="Produto/Item" type="text" [value]="formProduct()" (valueChange)="setString(formProduct, $event)" placeholder="Ex: Leite Condensado"></app-form-input>
      
      <div class="form-row">
        <app-form-input label="Quantidade" type="number" [value]="String(formQuantity())" (valueChange)="setNumber(formQuantity, $event)"></app-form-input>
        <app-form-input label="Preço Total" type="number" [value]="String(formPrice())" (valueChange)="setNumber(formPrice, $event)"></app-form-input>
      </div>
    </div>

    <div footer>
      <app-button name="Cancelar" type="secondary" (clicked)="isModalOpen.set(false)" [disabled]="false"></app-button>
      <app-button [name]="isEditing() ? 'Salvar Alterações' : 'Confirmar Compra'" type="primary" (clicked)="save()" [disabled]="!formSupplier() || !formProduct()"></app-button>
    </div>
  </app-modal>
</section>
