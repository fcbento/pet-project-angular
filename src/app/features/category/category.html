<section class="category">
  <header class="category__header">
    <div class="title-group">
      <h1>Categorias</h1>
      <span class="subtitle">Controle de categorias dos produtos </span>
    </div>
    <app-button [disabled]="false" (clicked)="openForm()" name="+ Nova categoria" type="tertiary" />
  </header>
  @if (formOpen()) {
  <div class="category__register">
    <app-register (success)="onSuccess()" />
  </div>
  }
  <app-list [updateTable]="updateTable()" />
</section>
